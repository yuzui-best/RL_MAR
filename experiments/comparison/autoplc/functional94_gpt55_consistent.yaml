environment:
  rag_data_dir: "{ROOTPATH}/data/rag_data"
  shot_data_dir: "{ROOTPATH}/data/rag_data/few_shots"
  log_dir: "{ROOTPATH}/logs"
  st_plan: "{ROOTPATH}/data/rag_data/st/st_case_plan"
  instruction_dir: "{ROOTPATH}/data/rag_data/instructions"
  st_code_dir: "{ROOTPATH}/data/rag_data/st/st_case_code"
  codesys_dir: "D:/Tools/CODESYS/CODESYS/Common/CODESYS.exe"
model:
  name: "gpt-5.5"
  max_tokens: 16384
  temperature: 0.1
  top_p: 0.9
retrieve:
  model: "glm-4-airx"
  temperature: 0.1
  top_p: 0.9
modeler:
  plan_set_name: "oscat_english"
verify:
  count: 3
  openness: "http://127.0.0.1:9000"  # Set to your local verification service.
  codesys_ip:
    - "http://127.0.0.1:19000/api/v1/pou/workflow"
retrieval:
  case_alternatives: ["ARRAY_TREND", "AUTORUN", "IRTRANS_RCV_1"]
  b25_model: "BM25Okapi"
instruction:
  path: ["{ROOTPATH}/data/rag_data/instructions/st_brief_keywords.jsonl"]
  score_threshold: 50
  top_k: 2
  function_usage_path: "{ROOTPATH}/data/rag_data/st/st_functions_usage.json"
workflow:
  retrieve_disabled: true
  modeling_disabled: false
  debugger_disabled: false
  api_rec_disabled: true
  auto_learn_disabled: true
  is_coding_fewshot: true
  is_retrieve_fewshot: false
  is_modeling_fewshot: false
  is_debugger_fewshot: false
  is_api_rec_fewshot: false
  is_auto_learn_fewshot: false
